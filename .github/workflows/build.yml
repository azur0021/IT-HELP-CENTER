name: Build VuePress

# 什么时候触发？
on:
  push:
    branches: [main]      # 每次推送到main分支时触发
  workflow_dispatch:      # 也允许手动点击触发

# 任务定义
jobs:
  build:
    # 运行环境：Ubuntu虚拟机（GitHub免费提供）
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: 拉取你的代码
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Step 2: 安装Node.js 16（你文档里要求的版本）
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: 'npm'
      
      # Step 3: 安装依赖
      - name: Install dependencies
        run: npm ci
      
      # Step 4: 构建VuePress
      - name: Build VuePress
        run: npm run docs:build
      
      # Step 5: 把dist文件夹打包成Artifact（产物）
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: docs/.vuepress/dist